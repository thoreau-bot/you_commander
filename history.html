<!doctype html><meta charset=utf-8><title>YouCommander · History</title><link rel=icon href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='8' fill='%232a5bd7'/%3E%3Cg fill='none' stroke='white' stroke-width='2.6' stroke-linecap='round' stroke-linejoin='round'%3E%3Cpolyline points='9,13 16,7.5 23,13'/%3E%3Cpolyline points='9,20 16,14.5 23,20'/%3E%3Cline x1='12' y1='26' x2='20' y2='26'/%3E%3C/g%3E%3C/svg%3E"><meta name=viewport content="width=device-width,initial-scale=1">
<link rel=stylesheet href="/static/app.css">
<style>
main{max-width:1120px;margin:auto;padding:18px 22px 60px}
.lbl{margin-top:4px}
.cw{display:flex;gap:10px;overflow-x:auto;padding:4px 2px 14px;scroll-snap-type:x proximity}
.cw>div{flex:0 0 240px;padding:10px 12px;border-radius:var(--r);background:var(--sf);border:1px solid var(--bd);box-shadow:var(--sh);cursor:pointer;scroll-snap-align:start}
.cw>div:hover{border-color:var(--bd2);background:var(--sf2)}
.cw .ti{font-weight:600;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.cw small{display:block;margin:2px 0 8px;color:var(--mut);font-variant-numeric:tabular-nums}
.cw .none{flex:none;padding:10px 0;border:0;background:none;box-shadow:none;cursor:default;color:var(--mut)}
.tools{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin:14px 0 10px}
.search{position:relative;display:flex;align-items:center}
.search input{width:280px;padding-right:34px}.search kbd{position:absolute;right:9px;pointer-events:none}
#chips{display:flex;gap:4px}#chips button{min-height:30px}
#wq{margin-left:auto}
.list{border:1px solid var(--bd);border-radius:var(--r);background:var(--sf);box-shadow:var(--sh);overflow:hidden}
.row{display:grid;grid-template-columns:minmax(0,1fr) 150px 80px 56px;gap:12px;padding:9px 14px;border-bottom:1px solid var(--bd);align-items:center;cursor:pointer}
.row.head{cursor:default;color:var(--mut);font-size:var(--fs-s);font-weight:600;padding:7px 14px;background:var(--sf2)}.row.head:hover{background:var(--sf2)}
.row:last-child{border-bottom:0}
.row:hover{background:var(--sf2)}.row.f{background:var(--ac-s);box-shadow:inset 3px 0 0 var(--ac)}
.row small{color:var(--mut);font-variant-numeric:tabular-nums;font-size:var(--fs-s)}
.row .t{overflow:hidden;text-overflow:ellipsis;white-space:nowrap;font-weight:500}
.row .bar2{margin-top:6px;max-width:320px}
.row p{margin:0}
@media(max-width:800px){.row{grid-template-columns:minmax(0,1fr) 70px}.row>:nth-child(2),.row>:nth-child(4){display:none}}
.row>div{min-width:0}
</style>
<div class=topbar><a class=brand href="/" title="Back to Commander"><svg width=24 height=24 viewBox="0 0 32 32" role=img aria-label=YouCommander><rect width=32 height=32 rx=8 fill="var(--ac)"/><g fill=none stroke="var(--ac-fg)" stroke-width=2.6 stroke-linecap=round stroke-linejoin=round><polyline points="9,13 16,7.5 23,13"/><polyline points="9,20 16,14.5 23,20"/><line x1=12 y1=26 x2=20 y2=26 /></g></svg></a><nav><a href="/">Commander</a><a href="/triage" title="Sort the inbox one video at a time">Triage</a><a href="/watch" title="The player with notes, loop and queue">Watch</a><a class=here>History</a></nav><span class=fill></span><span id=sum class=meta></span><button class="ghost help" data-help title="Keyboard shortcuts (?)">?</button></div>
<main>
<div class=lbl>Continue watching</div><div class=cw id=cw></div>
<div class=tools><div class=search><input id=fq placeholder="Filter by title or channel" aria-label="Filter history"><kbd>/</kbd></div><span id=chips role=group aria-label="Show"></span><button id=wq title="Play everything listed, in this order, on the Watch page">Watch these in order</button></div>
<div class=list id=list></div>
<p class=mut style="font-size:var(--fs-s);margin-top:10px">Every video you open or play anywhere in YouCommander is listed here, newest first, and stored only on this computer.</p>
</main>
<div id=help><div class=card>
 <h2>Keyboard shortcuts<span class=mut>Esc or ? closes</span></h2>
 <div class=cols><div><dl><dt><kbd>↑</kbd><kbd>↓</kbd></dt><dd>move</dd><dt><kbd>Enter</kbd></dt><dd>watch</dd><dt><kbd>/</kbd></dt><dd>filter</dd><dt><kbd>Esc</kbd></dt><dd>back to Commander</dd></dl></div></div>
</div></div>
<script src="/static/app.js"></script>
<script>
const J=async u=>(await fetch(u)).json(),esc=s=>(s||'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const fmt=s=>{s=Math.max(0,Math.floor(s||0));const h=Math.floor(s/3600),m=Math.floor(s%3600/60);return h?h+'h '+m+'m':m?m+'m':s+'s'};
const clock=s=>{s=Math.floor(s||0);return Math.floor(s/60)+':'+String(s%60).padStart(2,'0')};
const when=s=>{if(!s)return'';const d=new Date(s.replace(' ','T')+'Z');return d.toLocaleDateString(undefined,{month:'short',day:'numeric'})+' '+d.toLocaleTimeString(undefined,{hour:'numeric',minute:'2-digit'})};
let ALL=[],MODE='all',FI=0;
const MODES={all:['All',x=>true],played:['Actually watched',x=>x.seconds>5],watch:['Watch page',x=>x.src=='watch'],commander:['Commander',x=>x.src=='commander'],triage:['Triage',x=>x.src=='triage']};
function shown(){const q=fq.value.trim().toLowerCase();return ALL.filter(MODES[MODE][1]).filter(x=>!q||((x.title||'')+' '+(x.channel||'')).toLowerCase().includes(q))}
chips.innerHTML=Object.entries(MODES).map(([k,v])=>`<button data-m=${k} class="sm ${k==MODE?'on':'ghost'}" aria-pressed="${k==MODE}">${v[0]}</button>`).join('');
function paintChips(){chips.querySelectorAll('[data-m]').forEach(b=>{const on=b.dataset.m==MODE;b.classList.toggle('on',on);b.classList.toggle('ghost',!on);b.setAttribute('aria-pressed',on)})}
function draw(){const L=shown();FI=Math.min(FI,Math.max(0,L.length-1));paintChips();
 list.innerHTML=(L.length?'<div class="row head"><span>Video</span><span>Last opened</span><span>Watched</span><span>Opens</span></div>':'')+L.map((x,k)=>`<div class="row${k==FI?' f':''}" data-v="${x.video_id}"><div><div class=t>${esc(x.title||x.video_id)}</div><small>${esc(x.channel||'')}${x.marks?' · '+x.marks+' note'+(x.marks>1?'s':'')+' at times':''}${x.last_pos>5?' · <span class=tc>'+clock(x.last_pos)+'</span>':''}</small>${x.duration&&x.last_pos>5?`<div class=bar2><i style="width:${Math.min(100,100*x.last_pos/x.duration)}%"></i></div>`:''}</div><small>${when(x.last_watched)}</small><small>${x.seconds>5?fmt(x.seconds):'opened'}</small><small class=tc>${x.plays}×</small></div>`).join('')||(ALL.length?'<div class=empty><b>No history matches</b>'+(fq.value.trim()?'Nothing opened so far matches “'+esc(fq.value.trim())+'”. ':'')+'Try another filter or All.</div>':'<div class=empty><b>Nothing here yet</b>Open a video from Commander (Space) or press W to use the Watch page.</div>');
 wq.disabled=!L.length;
 const f=list.querySelector('.f');if(f)f.scrollIntoView({block:'nearest'})}
chips.onclick=e=>{if(e.target.dataset.m){MODE=e.target.dataset.m;FI=0;draw();const b=chips.querySelector(`[data-m=${MODE}]`);if(b&&e.detail===0)b.focus()}};fq.oninput=()=>{FI=0;draw()};
list.onclick=e=>{const r=e.target.closest('[data-v]');if(r)location.href='/watch?v='+r.dataset.v};
cw.onclick=e=>{const r=e.target.closest('[data-v]');if(r)location.href='/watch?v='+r.dataset.v};
wq.onclick=()=>{const ids=shown().map(x=>x.video_id).slice(0,300);if(!ids.length)return;try{localStorage.setItem('watchIds',JSON.stringify(ids))}catch(e){}location.href='/watch?q=1&v='+ids[0]};
addEventListener('keydown',e=>{const a=document.activeElement;if(a&&a.tagName=='INPUT'){if(e.key=='Escape'){e.preventDefault();if(fq.value){fq.value='';draw()}else a.blur()}else if(e.key=='Enter'||e.key=='ArrowDown'){a.blur();draw();e.preventDefault()}return}
 if(e.ctrlKey||e.metaKey||e.altKey||yc.onControl(e))return;if(e.key=='Escape'&&yc.escapeControl(e))return;
 const L=shown();if(e.key=='ArrowDown'){e.preventDefault();if(document.activeElement&&document.activeElement.blur)document.activeElement.blur();FI=Math.min(L.length-1,FI+1);draw()}else if(e.key=='ArrowUp'){e.preventDefault();FI=Math.max(0,FI-1);draw()}
 else if(e.key=='Enter'&&L[FI])location.href='/watch?v='+L[FI].video_id;else if(e.key=='Escape'&&yc.escapeControl(e))return;else if(e.key=='/'){e.preventDefault();fq.focus()}else if(e.key=='Escape')location.href='/'});
(async()=>{const d=await J('/api/history?limit=2000');ALL=d.items;sum.textContent=d.videos+' videos opened, '+fmt(d.seconds)+' watched';
 const c=ALL.filter(x=>x.duration>0&&x.last_pos>30&&x.last_pos<x.duration-20).slice(0,10);
 cw.innerHTML=c.map(x=>`<div data-v="${x.video_id}"><div class=ti>${esc(x.title||x.video_id)}</div><small>${esc(x.channel||'')} · ${clock(x.last_pos)} of ${clock(x.duration)}</small><div class=bar2><i style="width:${100*x.last_pos/x.duration}%"></i></div></div>`).join('')||'<div class=none>Nothing in progress. Videos you stop partway through show up here.</div>';
 draw()})();
</script>
